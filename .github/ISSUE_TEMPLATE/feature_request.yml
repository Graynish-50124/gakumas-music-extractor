name: 機能提案
description: 新機能や使い勝手の改善を提案します
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したいこと
      description: どのような場面で困るかを説明してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 希望する動作や画面を説明してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 現在の回避策や別案があれば記載してください。
