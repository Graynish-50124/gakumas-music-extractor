name: 不具合報告
description: 再現可能な不具合を報告します
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: ゲーム音源、Manifest、キャッシュ、個人情報は添付しないでください。
  - type: textarea
    id: summary
    attributes:
      label: 不具合の内容
      description: 実際に起きたことを説明してください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. アプリを起動
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: アプリの版
      placeholder: 例: one-folder版 / コミットID
  - type: input
    id: windows
    attributes:
      label: Windowsの版
      placeholder: 例: Windows 11 24H2
  - type: textarea
    id: logs
    attributes:
      label: ログ
      description: 個人情報とローカルパスを削除した範囲だけ貼り付けてください。
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: 確認
      options:
        - label: ゲーム音源、Manifest、キャッシュ、個人情報を含めていません。
          required: true
